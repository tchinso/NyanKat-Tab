<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NyanKatX3 Tab 설정</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icon48.png" alt="" width="32" height="32">
      <div>
        <h1>NyanKatX3 Tab</h1>
        <p>설정</p>
      </div>
    </header>

    <main>
      <label class="toggle-row" for="sendZeroOnYouTube">
        <span>
          <strong>YouTube 0 입력</strong>
          <small>watch 페이지 로드 후 영상 시작 위치를 처음으로 보냅니다.</small>
        </span>
        <input id="sendZeroOnYouTube" type="checkbox">
      </label>

      <label class="toggle-row" for="enableKoneBase64AutoDecode">
        <span>
          <strong>kone.gg Base64 자동 디코딩</strong>
          <small>감지된 Base64를 자동으로 디코딩하고 링크/복사/원문 확인을 표시합니다.</small>
        </span>
        <input id="enableKoneBase64AutoDecode" type="checkbox">
      </label>

      <button id="openScrollSettings" class="link-button" type="button">
        사이트별 플로팅 스크롤 버튼 설정 열기
      </button>
    </main>

    <footer id="status" aria-live="polite">저장됨</footer>
    <script src="popup.js"></script>
  </body>
</html>
