<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NyanKatX3 Tab 설정</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icon48.png" alt="" width="32" height="32">
      <div>
        <h1>NyanKatX3 Tab</h1>
        <p>설정</p>
      </div>
    </header>

    <nav class="tab-list" role="tablist" aria-label="설정 탭">
      <button id="basicTab" class="tab-button" type="button" role="tab" aria-selected="true" aria-controls="basicPanel">기본</button>
      <button id="subtitleTab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="subtitlePanel">자막</button>
      <button id="downloadTab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="downloadPanel">자막추출</button>
    </nav>

    <main>
      <section id="basicPanel" class="tab-panel" role="tabpanel" aria-labelledby="basicTab">
        <button id="openScrollSettings" class="link-button" type="button">
          플로팅 자동 스크롤 버튼 설정 열기
        </button>

        <button id="openScrollPositionMode" class="link-button" type="button">
          스크롤 버튼 위치 조정 모드 시작
        </button>

        <label class="toggle-row" for="sendZeroOnYouTube">
          <span>Youtube 영상 항상 처음부터 재생</span>
          <input id="sendZeroOnYouTube" type="checkbox">
        </label>

        <label class="toggle-row" for="enableKoneBase64AutoDecode">
          <span>Kone.gg에서 base64를 자동으로 디코딩</span>
          <input id="enableKoneBase64AutoDecode" type="checkbox">
        </label>

        <button id="openKioDownload" class="link-button" type="button">
          kio.ac 다운로드 상태 열기
        </button>

        <footer id="status" aria-live="polite">저장됨</footer>
      </section>

      <section id="subtitlePanel" class="tab-panel subtitle-panel" role="tabpanel" aria-labelledby="subtitleTab" hidden>
        <div class="subtitle-heading">
          <h2>자막 오버레이</h2>
          <p>현재 페이지와 iframe에서 찾은 동영상에 로컬 자막을 겹쳐 표시합니다.</p>
        </div>

        <div class="subtitle-row">
          <label for="videoSelect">대상 동영상</label>
          <select id="videoSelect"></select>
          <button id="refreshVideos" class="icon-button" type="button" title="동영상 다시 검색" aria-label="동영상 다시 검색">↻</button>
        </div>

        <div class="subtitle-row file-row">
          <label for="subtitleFile">자막 파일</label>
          <input id="subtitleFile" type="file" accept=".srt,.vtt,.ass,.ssa,.smi,.sami,.txt">
        </div>

        <div class="subtitle-row">
          <label for="subtitleEncoding">인코딩</label>
          <select id="subtitleEncoding">
            <option value="auto">자동 감지 (권장)</option>
            <option value="utf-8">UTF-8</option>
            <option value="utf-16le">UTF-16LE</option>
            <option value="utf-16be">UTF-16BE</option>
            <option value="euc-kr">EUC-KR / CP949 호환</option>
            <option value="windows-1252">Latin-1 (비권장)</option>
          </select>
        </div>

        <div class="subtitle-row sync-row">
          <label for="subtitleOffset">자막 싱크</label>
          <div class="sync-controls">
            <div class="offset-value">
              <input id="subtitleOffset" type="number" value="0" step="250" aria-describedby="offsetHint">
              <span>ms</span>
            </div>
            <div class="sync-buttons" aria-label="자막 싱크 조정">
              <button type="button" data-offset-adjust="-10000" aria-label="자막 10초 앞당기기">−10</button>
              <button type="button" data-offset-adjust="-1000" aria-label="자막 1초 앞당기기">−1</button>
              <button type="button" data-offset-adjust="-250" aria-label="자막 0.25초 앞당기기">−0.25</button>
              <button type="button" data-offset-adjust="250" aria-label="자막 0.25초 늦추기">+0.25</button>
              <button type="button" data-offset-adjust="1000" aria-label="자막 1초 늦추기">+1</button>
              <button type="button" data-offset-adjust="10000" aria-label="자막 10초 늦추기">+10</button>
            </div>
            <small id="offsetHint">−는 자막을 앞당기고, +는 늦춥니다.</small>
          </div>
        </div>

        <div class="subtitle-actions">
          <button id="loadSubtitle" class="primary-button" type="button">자막 적용</button>
          <button id="unloadSubtitle" type="button">자막 제거</button>
        </div>

        <hr>

        <h3>스타일</h3>
        <div class="subtitle-row">
          <label for="subtitleFont">폰트</label>
          <select id="subtitleFont">
            <option value='"Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif'>기본값</option>
          </select>
        </div>
        <div class="subtitle-row">
          <label for="subtitleFontSize">크기 (px)</label>
          <input id="subtitleFontSize" type="range" min="10" max="120" step="1" value="48">
          <output id="subtitleFontSizeValue" for="subtitleFontSize">48 px</output>
        </div>
        <div class="subtitle-row">
          <label for="subtitleVerticalPosition">세로 위치</label>
          <input id="subtitleVerticalPosition" type="range" min="0" max="100" step="1" value="100" title="0% 위쪽, 100% 아래쪽">
          <output id="subtitleVerticalPositionValue" for="subtitleVerticalPosition">100%</output>
        </div>
        <div class="subtitle-row compact-row">
          <label for="subtitleColor">글자색</label>
          <input id="subtitleColor" type="color" value="#ffffff">
          <label for="subtitleBackgroundColor">배경색</label>
          <input id="subtitleBackgroundColor" type="color" value="#000000">
        </div>
        <div class="subtitle-row">
          <label for="subtitleBackgroundOpacity">배경 투명도</label>
          <input id="subtitleBackgroundOpacity" type="range" min="0" max="1" step="0.01" value="0.8">
          <output id="subtitleBackgroundOpacityValue" for="subtitleBackgroundOpacity">0.8</output>
        </div>
        <label class="subtitle-checkbox" for="subtitleTextShadow">
          <input id="subtitleTextShadow" type="checkbox" checked>
          <span>텍스트 그림자 (가독성)</span>
        </label>
        <label class="subtitle-checkbox" for="subtitleVisible">
          <input id="subtitleVisible" type="checkbox" checked>
          <span>자막 보이기</span>
        </label>

        <p id="subtitleStatus" class="subtitle-status" aria-live="polite">동영상을 다시 검색해 선택하세요.</p>
      </section>

      <section id="downloadPanel" class="tab-panel download-panel" role="tabpanel" aria-labelledby="downloadTab" hidden>
        <div class="subtitle-heading">
          <h2>감지된 자막 다운로드</h2>
          <p>영상을 재생하고 사이트의 자막을 켜면 자막 목록이 자동으로 갱신됩니다.</p>
        </div>
        <button id="refreshDownloads" class="link-button" type="button">자막 다시 검색</button>
        <p id="downloadEmpty">감지된 자막이 없습니다. 재생 페이지를 새로고침한 뒤 자막을 켜 보세요.</p>
        <ul id="downloadTracks" class="download-tracks" aria-label="감지된 자막"></ul>
        <p id="downloadStatus" class="subtitle-status" aria-live="polite"></p>
      </section>
    </main>

    <script src="popup.js"></script>
    <script src="subtitle-popup.js"></script>
    <script src="download-popup.js"></script>
  </body>
</html>
