<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NyanKatX3 Tab 설정</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icon48.png" alt="" width="32" height="32">
      <div>
        <h1>NyanKatX3 Tab</h1>
        <p>설정</p>
      </div>
    </header>

    <main>
      <label class="toggle-row" for="sendZeroOnYouTube">
        <span>
          <strong>YouTube 0 입력</strong>
          <small>watch 페이지 로드 후 영상을 처음으로 보냅니다.</small>
        </span>
        <input id="sendZeroOnYouTube" type="checkbox">
      </label>

      <label class="field-row" for="mouseGestureAutoScrollMode">
        <span>
          <strong>마우스 제스처 자동 스크롤</strong>
          <small>오른쪽 버튼 세로 드래그로 자동 스크롤을 시작합니다.</small>
        </span>
        <select id="mouseGestureAutoScrollMode">
          <option value="off">사용 안함</option>
          <option value="down">아래로만</option>
          <option value="both">위/아래 모두</option>
        </select>
      </label>

      <label class="field-row" for="autoScrollSpeed">
        <span>
          <strong>자동 스크롤 속도</strong>
          <small>현재 속도 <output id="autoScrollSpeedValue" for="autoScrollSpeed">2</output></small>
        </span>
        <select id="autoScrollSpeed"></select>
      </label>
    </main>

    <footer id="status" aria-live="polite">저장됨</footer>
    <script src="popup.js"></script>
  </body>
</html>
