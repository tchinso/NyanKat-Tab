<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kio.ac 다운로드 상태</title>
    <link rel="stylesheet" href="kiodownload.css">
  </head>
  <body>
    <header>
      <img src="icon48.png" alt="" width="36" height="36">
      <div>
        <h1>kio.ac 다운로드 상태</h1>
        <p id="summary" aria-live="polite">감지 대기 중</p>
      </div>
      <button id="refresh" type="button">새로고침</button>
    </header>

    <main>
      <section id="emptyState" class="empty-state" hidden>
        열린 kio.ac 탭에서 감지된 항목이 없습니다.
      </section>
      <section id="entryList" class="entry-list" aria-label="kio.ac 다운로드 감지 목록"></section>
    </main>

    <template id="entryTemplate">
      <article class="entry">
        <div class="entry-heading">
          <div>
            <h2 class="entry-title"></h2>
            <a class="entry-url" target="_blank" rel="noopener noreferrer"></a>
          </div>
          <strong class="entry-count"></strong>
        </div>
        <dl class="entry-meta">
          <div>
            <dt>갱신</dt>
            <dd class="entry-updated"></dd>
          </div>
          <div>
            <dt>프레임</dt>
            <dd class="entry-frame"></dd>
          </div>
          <div>
            <dt>버튼 해제</dt>
            <dd class="entry-unlocked"></dd>
          </div>
        </dl>
        <ol class="match-list"></ol>
      </article>
    </template>

    <script src="kiodownload.js"></script>
  </body>
</html>
