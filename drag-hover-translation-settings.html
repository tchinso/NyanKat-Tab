<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>드래그 번역 설정</title>
    <link rel="stylesheet" href="drag-hover-translation-settings.css">
  </head>
  <body>
    <main>
      <header>
        <h1>드래그 번역</h1>
        <button id="close" type="button" aria-label="설정 닫기">×</button>
      </header>
      <label class="switch-row" for="enabled">
        <span>번역 사용</span>
        <input id="enabled" type="checkbox">
      </label>
      <p id="settingStatus" class="status" aria-live="polite"></p>
      <section>
        <h2>모델 준비</h2>
        <label for="language">원문 언어</label>
        <select id="language">
          <option value="en">영어</option>
          <option value="ja">일본어</option>
          <option value="zh">중국어</option>
          <option value="zh-Hant">중국어(번체)</option>
          <option value="es">스페인어</option>
          <option value="fr">프랑스어</option>
          <option value="de">독일어</option>
          <option value="ru">러시아어</option>
          <option value="pt">포르투갈어</option>
        </select>
        <button id="prepareModels" type="button" disabled>언어 감지·번역 모델 함께 준비</button>
        <p id="detectorStatus" class="status" aria-live="polite">언어 감지: 상태 확인 중…</p>
        <p id="translatorStatus" class="status" aria-live="polite">번역: 상태 확인 중…</p>
      </section>
    </main>
    <script src="drag-hover-translation-settings.js"></script>
  </body>
</html>
