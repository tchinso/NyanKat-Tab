<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>플로팅 자동 스크롤 버튼 설정</title>
    <link rel="stylesheet" href="scroll-settings.css">
  </head>
  <body>
    <header>
      <img src="icon48.png" alt="" width="36" height="36">
      <div>
        <h1>플로팅 자동 스크롤 버튼</h1>
        <p>모든 사이트에 공통으로 적용됩니다.</p>
      </div>
    </header>

    <main>
      <section class="settings-section" aria-labelledby="scrollSettingsTitle">
        <h2 id="scrollSettingsTitle">자동 스크롤 설정</h2>
        <article class="settings-card">
          <label class="checkbox-label">
            <input id="enabled" type="checkbox">
            <span>자동 스크롤 버튼 사용</span>
          </label>

          <div id="scrollControls" class="control-grid">
            <label>
              <span>버튼 크기</span>
              <input id="buttonSize" type="number" min="20" max="140" step="1">
            </label>
            <label>
              <span>🔽 속도</span>
              <input id="downSpeed" type="number" min="0.25" max="80" step="0.25">
            </label>
            <label>
              <span>⏬ 속도</span>
              <input id="fastDownSpeed" type="number" min="0.25" max="80" step="0.25">
            </label>
          </div>

          <p class="hint">버튼은 화면 오른쪽 중앙에 2×2로 표시됩니다. ⬆️는 최상단, ⬇️는 페이지 90% 지점으로 이동합니다.</p>
        </article>
      </section>

      <section class="settings-section" aria-labelledby="disabledSitesTitle">
        <h2 id="disabledSitesTitle">자동 스크롤 버튼을 사용하지 않는 사이트</h2>
        <label class="textarea-label" for="disabledSites">
          <span>한 줄에 사이트 주소 하나씩 입력하세요.</span>
          <textarea id="disabledSites" rows="8" placeholder="example.com&#10;sub.example.com"></textarea>
        </label>
      </section>
    </main>

    <footer id="status" aria-live="polite">저장됨</footer>
    <script src="scroll-settings.js"></script>
  </body>
</html>
