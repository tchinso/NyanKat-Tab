<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>팝업으로 링크 미리보기 설정</title>
    <link rel="stylesheet" href="link-preview-settings.css">
    <script src="link-preview-settings.js" defer></script>
  </head>
  <body>
    <header>
      <img src="icon48.png" alt="" width="36" height="36">
      <div>
        <h1>팝업으로 링크 미리보기</h1>
        <p>링크 위에서 사용할 동작과 닫기 방법을 설정합니다.</p>
      </div>
    </header>

    <main>
      <label class="setting-row enable-row" for="enabled">
        <span>팝업으로 링크 미리보기 사용</span>
        <input id="enabled" type="checkbox">
      </label>

      <fieldset id="previewOptions">
        <legend>활성화 트리거</legend>
        <div class="choice-list">
          <label><input type="radio" name="trigger" value="longClick">긴 클릭</label>
          <label><input type="radio" name="trigger" value="longHover">긴 호버</label>
          <label><input type="radio" name="trigger" value="linkDrag">링크 드래그</label>
        </div>

        <label class="timing-row" for="longClickMs">
          <span>긴 클릭 시간</span>
          <span class="number-field"><input id="longClickMs" type="number" min="50" max="5000" step="50" inputmode="numeric"> ms</span>
        </label>
        <label class="timing-row" for="longHoverMs">
          <span>긴 호버 시간</span>
          <span class="number-field"><input id="longHoverMs" type="number" min="50" max="5000" step="50" inputmode="numeric"> ms</span>
        </label>

        <div class="closing-group">
          <h2>닫기 트리거</h2>
          <div class="setting-row"><span>닫기 버튼</span><strong>항상 사용</strong></div>
          <label class="setting-row" for="closeOnOutsideClick">
            <span>팝업 외부 클릭 시 닫기</span>
            <input id="closeOnOutsideClick" type="checkbox">
          </label>
        </div>
      </fieldset>
    </main>

    <footer><output id="status" aria-live="polite"></output></footer>
  </body>
</html>
